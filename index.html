<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon.png?v=mascot-1" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico?v=mascot-1" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=mascot-1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090c19" />
    <meta name="description" content="Cube Hero is a free speedcubing arena. Race AI, beat your ghost, learn CFOP, and earn rewards in Hero Journey. Play instantly on the web." />
    <meta name="color-scheme" content="dark" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Cube Hero — Race. Learn. Become a Hero." />
    <meta property="og:description" content="Race AI, beat your ghost, master CFOP, and level up. The speedcubing arena is open." />
    <meta property="og:image" content="/cube-hero-mascot-768.png" />
    <title>Cube Hero — Race. Learn. Become a Hero.</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- A native-only diagnostics view if JavaScript or a lazy-loaded game chunk fails.
         Web routing and gameplay are unchanged. No network logging is used. -->
    <script>
      (function () {
        var firstFailure = '';
        var diagnosticShown = false;
        function nativeAndroid() {
          try {
            if (window.Capacitor && window.Capacitor.getPlatform && window.Capacitor.getPlatform() === 'android') return true;
          } catch (_) { /* check the location instead */ }
          return location.hostname === 'localhost' && /Android/i.test(navigator.userAgent);
        }
        function gameIsVisible() {
          return !!document.querySelector('.app-shell, .cube-welcome');
        }
        function reveal(message) {
          if (diagnosticShown || !nativeAndroid() || gameIsVisible()) return;
          diagnosticShown = true;
          var pane = document.createElement('div');
          pane.setAttribute('role', 'alert');
          pane.id = 'cube-native-boot-diagnostic';
          pane.style.cssText = 'position:fixed;inset:0;z-index:2147483647;overflow:auto;background:#090c19;color:#f6f3ff;padding:calc(44px + env(safe-area-inset-top,0px)) 22px 32px;font:14px/1.6 system-ui,-apple-system,sans-serif;box-sizing:border-box;';
          var heading = document.createElement('h1');
          heading.textContent = 'CubeHero could not start';
          heading.style.cssText = 'font-size:22px;margin:0 0 10px;color:#e8d9ff';
          var instruction = document.createElement('p');
          instruction.textContent = 'The Android app loaded, but its game screen did not. Please send a screenshot of the diagnostic below so this can be fixed.';
          var detail = document.createElement('pre');
          detail.style.cssText = 'overflow-wrap:anywhere;white-space:pre-wrap;background:#141a35;border:1px solid #52417d;border-radius:10px;padding:14px;font:12px/1.5 ui-monospace,monospace';
          detail.textContent = String(message || 'No JavaScript error was recorded. The app may be stuck loading a local file.') + '\nPage: ' + location.href + '\nUser agent: ' + navigator.userAgent;
          var button = document.createElement('button');
          button.textContent = 'Retry loading CubeHero';
          button.style.cssText = 'padding:13px 18px;border:0;border-radius:10px;background:#8353ef;color:#fff;font:700 14px system-ui';
          button.onclick = function () { location.reload(); };
          pane.appendChild(heading);
          pane.appendChild(instruction);
          pane.appendChild(detail);
          pane.appendChild(button);
          document.body.appendChild(pane);
        }
        function record(message) {
          if (!firstFailure) firstFailure = message;
          setTimeout(function () { reveal(firstFailure); }, 1600);
        }
        window.addEventListener('error', function (event) {
          if (event.target && event.target !== window) {
            var target = event.target;
            var tag = target.tagName || 'resource';
            var url = target.src || target.href || '(unknown)';
            if (tag === 'SCRIPT' || tag === 'LINK') record('Failed to load ' + tag + ': ' + url);
            return;
          }
          record('JavaScript error: ' + (event.message || 'unknown') + '\n' + (event.filename || '') + ':' + (event.lineno || '') + ':' + (event.colno || ''));
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          record('Unhandled promise rejection: ' + (reason && (reason.stack || reason.message) || String(reason)));
        });
        window.addEventListener('DOMContentLoaded', function () {
          setTimeout(function () { reveal(firstFailure || 'Game screen never became visible after launch (15 seconds).'); }, 15000);
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
